[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra -v --timeout=300
markers =
    needs_dataset: ต้องมี dataset จริงของ ปตท. (label .txt) mount เข้ามา ไม่งั้น skip
    needs_cvat: ต้องมี CVAT server (ตั้ง env CVAT_URL / CVAT_USERNAME / CVAT_PASSWORD) ไม่งั้น skip
    slow: ใช้เวลานาน (เช่น UMAP) — ข้ามด้วย  -m "not slow"
